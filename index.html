<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高一知足 聯絡人查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* 隱藏預設的 select 箭頭，稍後用自訂樣式覆蓋，讓畫面更精緻 */
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        
        /* 簡單的淡入動畫，讓資料出現時更柔和 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col">

    <!-- 頂部導覽列 (溫暖的橘色) -->
    <header class="bg-orange-500 text-white p-4 shadow-md sticky top-0 z-50 flex items-center justify-center">
        <h1 class="text-xl font-bold tracking-wider">高一知足 聯絡人</h1>
    </header>

    <!-- 選擇區塊 -->
    <div class="p-5 bg-white shadow-sm border-b border-orange-100">
        <label for="studentSelect" class="block text-sm font-medium text-orange-800 mb-2">請選擇學生</label>
        <div class="relative">
            <select id="studentSelect" class="block w-full pl-4 pr-10 py-3 text-lg border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400 rounded-xl bg-orange-50/50 border text-gray-800 shadow-inner transition-colors">
                <option value="">---</option>
                <!-- 學生選項會透過 JavaScript 動態生成在這裡 -->
            </select>
            <!-- 自訂的下拉箭頭圖示 (橘色系) -->
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4">
                <svg class="h-5 w-5 text-orange-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </div>
        </div>
    </div>

    <!-- 結果顯示區塊 -->
    <main class="flex-grow p-5 overflow-y-auto">
        <div id="resultsContainer" class="max-w-md mx-auto">
            <!-- 預設狀態提示 (保護個資，畫面全空只有提示) -->
            <div id="emptyState" class="flex flex-col items-center justify-center text-orange-300 mt-12">
                <svg class="w-16 h-16 mb-4 text-orange-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <p class="text-sm text-center font-medium">資料已鎖定保護<br>請從上方選擇學生以顯示聯絡資訊</p>
            </div>
        </div>
    </main>

    <script>
        // 為了讓您方便複製單一檔案測試，資料先放在這裡。
        // 未來若要分離，只需將這段陣列移到 data.js 即可。
        const studentsData = [
            {"id": "519001", "name": "王品升", "parent": "王新凱", "mobile": "0912832433"},
            {"id": "519002", "name": "徐弘禮", "parent": "徐振家", "mobile": "0976241391"},
            {"id": "519003", "name": "陳昱聖", "parent": "詹雯智", "mobile": "0921419288"},
            {"id": "519004", "name": "葉品杰", "parent": "葉育哲", "mobile": "0916724631"},
            {"id": "519005", "name": "葛修諒", "parent": "董逸秋", "mobile": "0928691226"},
            {"id": "519006", "name": "劉振梧", "parent": "陳柏均", "mobile": "0965404919"},
            {"id": "519007", "name": "戴名澤", "parent": "戴奎浚", "mobile": "0917077883"},
            {"id": "519008", "name": "龐安", "parent": "龐醛", "mobile": "0975533702"},
            {"id": "復學生待訂", "name": "陳昱安", "parent": "鄧佳蕙", "mobile": "0928547056"},
            {"id": "519084", "name": "王伊平", "parent": "葉家諭", "mobile": "0919735765"},
            {"id": "519085", "name": "王品媗", "parent": "王榮宏", "mobile": "0912680180"},
            {"id": "519086", "name": "王語菲", "parent": "王志偉", "mobile": "0922420906"},
            {"id": "519087", "name": "朱芊瑀", "parent": "林家緯", "mobile": "0917582081"},
            {"id": "519088", "name": "何芮瑄", "parent": "何敏彰", "mobile": "0928638036"},
            {"id": "519089", "name": "吳忻恩", "parent": "吳坤霖", "mobile": "0937661014"},
            {"id": "519090", "name": "吳岱瑾", "parent": "林辰蔓", "mobile": "0980758075"},
            {"id": "519091", "name": "吳凌恩", "parent": "凌麗君", "mobile": "0919924336"},
            {"id": "519092", "name": "吳蓮安", "parent": "吳家慶", "mobile": "0919950787"},
            {"id": "519093", "name": "呂沁恩", "parent": "呂佳全", "mobile": "0932366982"},
            {"id": "519094", "name": "林承樺", "parent": "林天輝", "mobile": "0976277900"},
            {"id": "519095", "name": "邱子芸", "parent": "邱仕彰", "mobile": "0934057091"},
            {"id": "519096", "name": "柯佳希", "parent": "柯千升", "mobile": "0933824863"},
            {"id": "519097", "name": "徐霈蓉", "parent": "林淑惠", "mobile": "0932651590"},
            {"id": "519098", "name": "張詠寧", "parent": "林逸薇", "mobile": "0919288672"},
            {"id": "519099", "name": "郭悅菱", "parent": "吳鈞傑", "mobile": "0912091969"},
            {"id": "519100", "name": "陳品希", "parent": "陳慶玲", "mobile": "0920906990"},
            {"id": "519101", "name": "陳雯潁", "parent": "王麗婷", "mobile": "0913522163"},
            {"id": "519102", "name": "陳樂芙", "parent": "蔡家怡", "mobile": "0958296689"},
            {"id": "519103", "name": "黃妍茗", "parent": "黃啟達", "mobile": "0913332166"},
            {"id": "519104", "name": "黃洛希", "parent": "黃士嘉", "mobile": "0916060232"},
            {"id": "519105", "name": "黃唯倫", "parent": "陳玫如", "mobile": "0961294886"},
            {"id": "519106", "name": "楊晞帆", "parent": "楊宥熙", "mobile": "0913169911"},
            {"id": "519107", "name": "趙彩緹", "parent": "趙家驊", "mobile": "0921628671"},
            {"id": "519108", "name": "歐育秝", "parent": "李沐瑤", "mobile": "0952532293"},
            {"id": "519109", "name": "鄭子晴", "parent": "鄭懷寶", "mobile": "0988373208"},
            {"id": "519110", "name": "鍾沛容", "parent": "鍾品正", "mobile": "0921273988"},
            {"id": "519111", "name": "簡耘可", "parent": "陳屏儒", "mobile": "0955997925"},
            {"id": "519112", "name": "蘇愛理", "parent": "蘇裕翔", "mobile": "0928298704"}
        ];

        const studentSelect = document.getElementById('studentSelect');
        const resultsContainer = document.getElementById('resultsContainer');
        const emptyStateHTML = document.getElementById('emptyState').outerHTML;

        // 頁面載入後，將資料動態塞入下拉式選單
        document.addEventListener('DOMContentLoaded', () => {
            studentsData.forEach(student => {
                const option = document.createElement('option');
                option.value = student.id; 
                option.textContent = student.name; // 下拉選單只顯示姓名
                studentSelect.appendChild(option);
            });
        });

        // 監聽下拉選單的變更事件
        studentSelect.addEventListener('change', function() {
            const selectedId = this.value;

            // 如果選回 "---" ，恢復預設空白鎖定畫面
            if (!selectedId) {
                resultsContainer.innerHTML = emptyStateHTML;
                return;
            }

            // 尋找選中的學生資料
            const student = studentsData.find(s => s.id === selectedId);

            if (student) {
                renderCard(student);
            }
        });

        function renderCard(student) {
            const mobileTrimmed = student.mobile.trim();
            
            // 產生按鈕 HTML (溫暖色系按鈕)
            let buttonsHtml = '';
            if (mobileTrimmed) {
                buttonsHtml = `
                    <a href="tel:${mobileTrimmed}" class="flex items-center justify-center bg-orange-100 hover:bg-orange-200 text-orange-700 font-bold py-4 px-4 rounded-xl transition-colors w-full shadow-sm text-lg border border-orange-200">
                        <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        撥打手機: ${mobileTrimmed}
                    </a>
                `;
            } else {
                buttonsHtml = `<p class="text-gray-400 text-center py-3 bg-gray-50 rounded-lg">無手機聯絡資料</p>`;
            }

            // 更新結果區塊內容，套用乾淨清新的卡片設計
            resultsContainer.innerHTML = `
                <div class="bg-white rounded-2xl p-6 shadow-md border border-orange-50 mt-2 animate-fade-in">
                    <div class="mb-5 border-b border-orange-100 pb-4 text-center">
                        <h2 class="text-3xl font-bold text-gray-800 tracking-wide">${student.name}</h2>
                    </div>
                    
                    <div class="mb-6 bg-orange-50/50 p-5 rounded-xl border border-orange-100/50">
                        <p class="text-sm text-orange-600/80 mb-1 font-medium">緊急聯絡人 (家長)</p>
                        <p class="text-2xl font-semibold text-gray-800">${student.parent}</p>
                    </div>

                    <div class="flex flex-col">
                        ${buttonsHtml}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
