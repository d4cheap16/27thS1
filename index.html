<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>知足通訊錄</title>
    
    <!-- 確保手機加入主畫面時能正確讀取圖示的絕對路徑 -->
    <link rel="apple-touch-icon" href="https://d4cheap16.github.io/27thS1/paws.png">
    <link rel="icon" href="https://d4cheap16.github.io/27thS1/paws.png" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-orange-500 text-white p-4 shadow-md sticky top-0 z-50 flex items-center justify-center">
        <h1 class="text-xl font-bold tracking-wider">知足通訊錄</h1>
    </header>

    <!-- 選擇區塊 -->
    <div class="p-5 bg-white shadow-sm border-b border-orange-100">
        <label for="studentSelect" class="block text-sm font-medium text-orange-800 mb-2">請選擇學生</label>
        <div class="relative">
            <select id="studentSelect" class="block w-full pl-4 pr-10 py-3 text-lg border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400 rounded-xl bg-orange-50/50 border text-gray-800 shadow-inner transition-colors">
                <option value="">---</option>
                <!-- 學生選項會動態生成在這裡 -->
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4">
                <svg class="h-5 w-5 text-orange-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </div>
        </div>
    </div>

    <!-- 結果顯示區塊 -->
    <main class="flex-grow p-5 overflow-y-auto">
        <div id="resultsContainer" class="max-w-md mx-auto">
            <!-- 預設保護畫面 -->
            <div id="emptyState" class="flex flex-col items-center justify-center text-orange-300 mt-12">
                <svg class="w-16 h-16 mb-4 text-orange-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <p class="text-sm text-center font-medium">資料已鎖定保護<br>請從上方選擇學生以顯示聯絡資訊</p>
            </div>
        </div>
    </main>

    <!-- 載入我們剛剛建立的外部資料檔 -->
    <script src="data.js"></script>

    <script>
        const studentSelect = document.getElementById('studentSelect');
        const resultsContainer = document.getElementById('resultsContainer');
        const emptyStateHTML = document.getElementById('emptyState').outerHTML;

        // 頁面載入後，將 data.js 裡的資料塞入下拉式選單
        document.addEventListener('DOMContentLoaded', () => {
            // 使用陣列的 index 作為 value，避免同名學生的問題
            if (typeof studentsData !== 'undefined') {
                studentsData.forEach((student, index) => {
                    const option = document.createElement('option');
                    option.value = index; 
                    option.textContent = student.name;
                    studentSelect.appendChild(option);
                });
            }
        });

        // 監聽下拉選單變更
        studentSelect.addEventListener('change', function() {
            const selectedIndex = this.value;

            // 恢復空白保護畫面
            if (selectedIndex === "") {
                resultsContainer.innerHTML = emptyStateHTML;
                return;
            }

            const student = studentsData[selectedIndex];
            if (student) {
                renderCard(student);
            }
        });

        function renderCard(student) {
            const studentMobile = (student.studentMobile || "").trim();
            const parentMobile = (student.parentMobile || "").trim();
            
            // 處理學生手機按鈕
            let studentButtonHtml = '';
            if (studentMobile) {
                studentButtonHtml = `
                    <a href="tel:${studentMobile}" class="flex items-center justify-center bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-bold py-3 px-4 rounded-xl transition-colors w-full shadow-sm text-lg border border-yellow-200">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        : ${studentMobile}
                    </a>
                `;
            } else {
                studentButtonHtml = `<p class="text-gray-400 text-center py-3 bg-gray-50/80 rounded-xl text-sm border border-gray-100 border-dashed">無學生手機資料</p>`;
            }

            // 處理家長手機按鈕
            let parentButtonHtml = '';
            if (parentMobile) {
                parentButtonHtml = `
                    <a href="tel:${parentMobile}" class="flex items-center justify-center bg-orange-200 hover:bg-orange-300 text-orange-900 font-bold py-3 px-4 rounded-xl transition-colors w-full shadow-sm text-lg border border-orange-300 mt-3">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        : ${parentMobile}
                    </a>
                `;
            } else {
                parentButtonHtml = `<p class="text-gray-500 text-center py-2 bg-orange-100/50 rounded-lg text-sm mt-3 border border-orange-200/50 border-dashed">無家長手機資料</p>`;
            }

            // 更新結果區塊內容
            resultsContainer.innerHTML = `
                <div class="bg-white rounded-2xl p-6 shadow-md border border-orange-50 mt-2 animate-fade-in">
                    <div class="mb-5 border-b border-orange-100 pb-4 text-center">
                        <h2 class="text-3xl font-bold text-gray-800 tracking-wide">${student.name}</h2>
                        <!-- 串接英文姓名：如果有資料才顯示，大小設定與中文相同(text-3xl)，顏色略淺(gray-600)區隔 -->
                        ${student.englishName ? `<h3 class="text-3xl font-medium text-gray-600 mt-2 tracking-wide">${student.englishName}</h3>` : ''}
                    </div>
                    
                    <!-- 學生本人區塊 -->
                    <div class="mb-6">
                        <p class="text-sm text-orange-600/80 mb-2 font-medium px-1">學生本人</p>
                        ${studentButtonHtml}
                    </div>

                    <!-- 家長聯絡區塊 -->
                    <div class="bg-orange-50/80 p-5 rounded-xl border border-orange-100/80">
                        <p class="text-sm text-orange-700/80 mb-1 font-medium">緊急聯絡人 (家長)</p>
                        <p class="text-2xl font-semibold text-gray-800">${student.parent}</p>
                        ${parentButtonHtml}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
